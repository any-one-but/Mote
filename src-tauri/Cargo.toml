[package]
name = "mote"
version = "0.10.15"
description = "Mote, a face in a window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"
plist = "1"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
